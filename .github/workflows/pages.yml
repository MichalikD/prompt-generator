name: Prüfen und veröffentlichen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run plugin:check
      - run: npm run plugin:build
      - name: Pluginpaket für die Prüfung bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: freie-spielleitung-02
          path: dist/freie-spielleitung-02-0.3.1.zip
          if-no-files-found: error
      - name: Statische Dateien vorbereiten
        run: |
          mkdir -p _site/src
          cp index.html character.html style.css _site/
          cp src/*.mjs _site/src/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
